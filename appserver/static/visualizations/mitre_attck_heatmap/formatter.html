<form class="splunk-formatter-section" section-label="Data">
    <splunk-control-group label="Matrix" help="Which ATT&amp;CK matrix, and which platform of it, to draw.">    
        <splunk-select name="{{VIZ_NAMESPACE}}.matrix" value="enterprise::">
            <option value="d3fend::">D3FEND</option>
            <option value="enterprise::">Enterprise - All</option>
            <option value="enterprise::Containers">Enterprise - Containers</option>
            <option value="enterprise::Identity Provider,IaaS,Office Suite,SaaS">Enterprise - Cloud - All</option>
            <option value="enterprise::Identity Provider">Enterprise - Cloud - Identity Provider</option>
            <option value="enterprise::IaaS">Enterprise - Cloud - IaaS</option>
            <option value="enterprise::Office Suite">Enterprise - Cloud - Office Suite</option>
            <option value="enterprise::SaaS">Enterprise - Cloud - SaaS</option>
            <option value="enterprise::ESXi">Enterprise - ESXi</option>
            <option value="enterprise::Linux">Enterprise - Linux</option>
            <option value="enterprise::macOS">Enterprise - macOS</option>
            <option value="enterprise::Network Devices">Enterprise - Network Devices</option>
            <option value="enterprise::PRE">Enterprise - PRE</option>
            <option value="enterprise::Windows">Enterprise - Windows</option>
            <option value="ics::">ICS - All</option>
            <option value="mobile::">Mobile - All</option>
            <option value="mobile::Android">Mobile - Android</option>
            <option value="mobile::iOS">Mobile - iOS</option>
        </splunk-select>
    </splunk-control-group>
    <splunk-control-group label="Matrix data" help="Bundled uses the ATT&amp;CK data shipped with this app. Imported uses the data downloaded by the app's scripted input, if it is enabled.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.matrixSource" value="bundled">
            <option value="bundled">Bundled</option>
            <option value="splunk">Imported</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="ATT&amp;CK version" help="Only used with imported data. For example 20 or 19.1. Blank uses the newest imported version.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.attackVersion" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="ID field" help="Name of the field holding the technique ID. Blank uses the 1st column.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.idField" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Value field" help="Name of the numeric field. Blank uses the 2nd column. Its name is the legend title.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.valueField" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Description field" help="Name of the field shown in the tooltip. Blank uses the 3rd column.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.descriptionField" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Status field" help="Name of a text field used to color cells. Blank turns status off.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.statusField" value="">
        </splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Display">
    <splunk-control-group label="Show" help="ID shows the technique ID in each cell. ID + name adds the name below it.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.display" value="id">
            <option value="id">ID</option>
            <option value="name">ID + name</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Sub-techniques" help="Show sub-techniques in the tooltip and count them in each tactic.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showSubTechniques" value="yes">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Hide empty" help="Hide techniques and tactics that have no value.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.hideNull" value="no">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Sort by" help="How techniques are ordered within a tactic.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.sortKey" value="data-value">
            <option value="data-value">Value</option>
            <option value="data-name">Name</option>
            <option value="data-id">ID</option>
            <option value="data-status">Status</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Sort order" help="Descending puts the highest values (or Z to A) first.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.sortOrder" value="desc">
            <option value="desc">Descending</option>
            <option value="asc">Ascending</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Search bar" help="Show a search box, match navigation and an All / With data / Gaps switch.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showSearchBar" value="yes">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Animate" help="Fade cells in and count up the percentages when the panel first loads.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.animate" value="yes">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Colors">
    <splunk-control-group label="Palette" help="Default and Risk use the three colors below (Risk reverses them). The others have their own colors.">
        <splunk-select name="{{VIZ_NAMESPACE}}.palette" value="default">
            <option value="default">Default</option>
            <option value="risk">Risk (reversed)</option>
            <option value="blues">Sequential blues</option>
            <option value="viridis">Viridis</option>
        </splunk-select>
    </splunk-control-group>
    <splunk-control-group label="Low color" help="Used when Palette is Default or Risk.">
        <splunk-color-picker type="custom" name="{{VIZ_NAMESPACE}}.startColor" value="#B63457">
            <splunk-color>#F9E721</splunk-color>
            <splunk-color>#FCFCBD</splunk-color>
            <splunk-color>#22908D</splunk-color>
            <splunk-color>#B83679</splunk-color>
            <splunk-color>#B63457</splunk-color>
            <splunk-color>#440C53</splunk-color>
            <splunk-color>#0C1587</splunk-color>
            <splunk-color>#000000</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Middle color" help="Used when Palette is Default or Risk.">
        <splunk-color-picker type="custom" name="{{VIZ_NAMESPACE}}.midColor" value="#FCFCBD">
            <splunk-color>#F9E721</splunk-color>
            <splunk-color>#FCFCBD</splunk-color>
            <splunk-color>#22908D</splunk-color>
            <splunk-color>#B83679</splunk-color>
            <splunk-color>#B63457</splunk-color>
            <splunk-color>#440C53</splunk-color>
            <splunk-color>#0C1587</splunk-color>
            <splunk-color>#000000</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="High color" help="Used when Palette is Default or Risk.">
        <splunk-color-picker type="custom" name="{{VIZ_NAMESPACE}}.endColor" value="#22908D">
            <splunk-color>#F9E721</splunk-color>
            <splunk-color>#FCFCBD</splunk-color>
            <splunk-color>#22908D</splunk-color>
            <splunk-color>#B83679</splunk-color>
            <splunk-color>#B63457</splunk-color>
            <splunk-color>#440C53</splunk-color>
            <splunk-color>#0C1587</splunk-color>
            <splunk-color>#000000</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Color bands" help="How many colors the scale is split into. Edges are equal when the bounds are Manual and follow the data (equal counts per band) when they are From data.">
        <splunk-select name="{{VIZ_NAMESPACE}}.colorBands" value="5">
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="7">7</option>
            <option value="9">9</option>
        </splunk-select>
    </splunk-control-group>
    <splunk-control-group label="Status colors" help="Used when a Status field is set. Format: name=#color, name=#color (for example covered=#53a051, gap=#d93f3c). The order sets the legend and sort order.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.statusColors" value="">
        </splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Scale">
    <splunk-control-group label="Roll up sub-techniques" help="Show an aggregate of a technique's sub-technique values on the technique itself, when it has no value of its own.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.rollup" value="none">
            <option value="none">None</option>
            <option value="sum">Sum</option>
            <option value="max">Max</option>
            <option value="avg">Average</option>
            <option value="count">Count</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Color bounds" help="Manual uses the two bounds below. From data uses the lowest (from zero) and highest value in the results.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.scaleMode" value="manual">
            <option value="manual">Manual</option>
            <option value="auto">From data</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Lower bound" help="Used when Color bounds is Manual.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.startVal" value="0">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Upper bound" help="Used when Color bounds is Manual.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.endVal" value="100">
        </splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Export">
    <splunk-control-group label="Export button" help="Adds a button that downloads the current data as an ATT&amp;CK Navigator layer file. Not available for D3FEND.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showExportButton" value="no">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>

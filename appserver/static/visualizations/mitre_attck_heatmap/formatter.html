<form class="splunk-formatter-section" section-label="Fields">
    <splunk-control-group label="ID field" help="Name of the field holding the technique ID. Blank uses the 1st column.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.idField" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Value field" help="Name of the numeric field. Blank uses the 2nd column.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.valueField" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Description field" help="Name of the field shown in the tooltip. Blank uses the 3rd column.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.descriptionField" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Status field" help="Name of a text field used to color cells. Blank turns status off.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.statusField" value="">
        </splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Layout">
    <splunk-control-group label="Matrix" help="">    
        <splunk-select name="{{VIZ_NAMESPACE}}.matrix" value="enterprise::">
            <option value="d3fend::">D3FEND</option>
            <option value="enterprise::">Enterprise - All</option>
            <option value="enterprise::Containers">Enterprise - Containers</option>
            <option value="enterprise::Identity Provider,IaaS,Office Suite,SaaS">Enterprise - Cloud - All</option>
            <option value="enterprise::Identity Provider">Enterprise - Cloud - Identity Provider</option>
            <option value="enterprise::IaaS">Enterprise - Cloud - IaaS</option>
            <option value="enterprise::Office Suite">Enterprise - Cloud - Office Suite</option>
            <option value="enterprise::SaaS">Enterprise - Cloud - SaaS</option>
            <option value="enterprise::ESXi">Enterprise - ESXi</option>
            <option value="enterprise::Linux">Enterprise - Linux</option>
            <option value="enterprise::macOS">Enterprise - macOS</option>
            <option value="enterprise::Network Devices">Enterprise - Network Devices</option>
            <option value="enterprise::PRE">Enterprise - PRE</option>
            <option value="enterprise::Windows">Enterprise - Windows</option>
            <option value="ics::">ICS - All</option>
            <option value="mobile::">Mobile - All</option>
            <option value="mobile::Android">Mobile - Android</option>
            <option value="mobile::iOS">Mobile - iOS</option>
        </splunk-select>
    </splunk-control-group>
    <splunk-control-group label="Display" help="">    
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.display" value="id">
            <option value="id">ID</option>
            <option value="name">Name</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Sub-Techniques" help="">    
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showSubTechniques" value="yes">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Hide Null" help="">    
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.hideNull" value="no">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Sort Key" help="">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.sortKey" value="data-name">
            <option value="data-name">Name</option>
            <option value="data-id">ID</option>
            <option value="data-value">Value</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Sort Order" help="">    
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.sortOrder" value="asc">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Legend Title" help="">    
        <splunk-text-input name="{{VIZ_NAMESPACE}}.legendTitle" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Search Bar" help="">    
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showSearchBar" value="yes">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Aggregation">
    <splunk-control-group label="Roll up sub-techniques" help="Show an aggregate of a technique's sub-technique values on the technique itself.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.rollup" value="none">
            <option value="none">None</option>
            <option value="sum">Sum</option>
            <option value="max">Max</option>
            <option value="avg">Average</option>
            <option value="count">Count</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Technique's own value" help="Keep it and roll up only when the technique has none, or include it in the aggregate.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.rollupParent" value="fill">
            <option value="fill">Keep it</option>
            <option value="include">Include it</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Color">
    <splunk-control-group label="Theme" help="">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.theme" value="light">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Lower Bound" help="">
        <splunk-color-picker type="custom" name="{{VIZ_NAMESPACE}}.startColor" value="#F9E721">
            <splunk-color>#F9E721</splunk-color>
            <splunk-color>#FCFCBD</splunk-color>
            <splunk-color>#22908D</splunk-color>
            <splunk-color>#B83679</splunk-color>
            <splunk-color>#B63457</splunk-color>
            <splunk-color>#440C53</splunk-color>
            <splunk-color>#0C1587</splunk-color>
            <splunk-color>#000000</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Midpoint" help="">
        <splunk-color-picker type="custom" name="{{VIZ_NAMESPACE}}.midColor" value="#22908D">
            <splunk-color>#F9E721</splunk-color>
            <splunk-color>#FCFCBD</splunk-color>
            <splunk-color>#22908D</splunk-color>
            <splunk-color>#B83679</splunk-color>
            <splunk-color>#B63457</splunk-color>
            <splunk-color>#440C53</splunk-color>
            <splunk-color>#0C1587</splunk-color>
            <splunk-color>#000000</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Upper Bound" help="">
        <splunk-color-picker type="custom" name="{{VIZ_NAMESPACE}}.endColor" value="#440C53">
            <splunk-color>#F9E721</splunk-color>
            <splunk-color>#FCFCBD</splunk-color>
            <splunk-color>#22908D</splunk-color>
            <splunk-color>#B83679</splunk-color>
            <splunk-color>#B63457</splunk-color>
            <splunk-color>#440C53</splunk-color>
            <splunk-color>#0C1587</splunk-color>
            <splunk-color>#000000</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Color bounds" help="Manual uses the two bounds below. From data uses the lowest and highest value in the results.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.scaleMode" value="manual">
            <option value="manual">Manual</option>
            <option value="auto">From data</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Lower bound from data" help="Only used when Color bounds is From data. Zero starts at 0 unless a value is negative.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.autoLowerBound" value="zero">
            <option value="zero">Zero</option>
            <option value="min">Lowest value</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Lower Bound" help="Used when Color bounds is Manual.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.startVal" value="0">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Upper Bound" help="Used when Color bounds is Manual.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.endVal" value="100">
        </splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Animation">
    <splunk-control-group label="Animate" help="">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.animate" value="no">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Duration (sec)" help="">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.duration" value="300">
        </splunk-text-input>
    </splunk-control-group>
</form>

<form class="splunk-formatter-section" section-label="Data">
    <splunk-control-group label="Matrix" help="The framework to show: ATT&amp;CK Enterprise, ICS or Mobile (optionally limited to one platform), or D3FEND.">    
        <splunk-select name="{{VIZ_NAMESPACE}}.matrix" value="enterprise::">
            <option value="d3fend::">D3FEND</option>
            <option value="enterprise::">Enterprise - All</option>
            <option value="enterprise::Containers">Enterprise - Containers</option>
            <option value="enterprise::Identity Provider,IaaS,Office Suite,SaaS">Enterprise - Cloud - All</option>
            <option value="enterprise::Identity Provider">Enterprise - Cloud - Identity Provider</option>
            <option value="enterprise::IaaS">Enterprise - Cloud - IaaS</option>
            <option value="enterprise::Office Suite">Enterprise - Cloud - Office Suite</option>
            <option value="enterprise::SaaS">Enterprise - Cloud - SaaS</option>
            <option value="enterprise::ESXi">Enterprise - ESXi</option>
            <option value="enterprise::Linux">Enterprise - Linux</option>
            <option value="enterprise::macOS">Enterprise - macOS</option>
            <option value="enterprise::Network Devices">Enterprise - Network Devices</option>
            <option value="enterprise::PRE">Enterprise - PRE</option>
            <option value="enterprise::Windows">Enterprise - Windows</option>
            <option value="ics::">ICS - All</option>
            <option value="mobile::">Mobile - All</option>
            <option value="mobile::Android">Mobile - Android</option>
            <option value="mobile::iOS">Mobile - iOS</option>
        </splunk-select>
    </splunk-control-group>
    <splunk-control-group label="Matrix data" help="Bundled uses the ATT&amp;CK version that comes with this app. Imported uses a newer version that the app's optional import has downloaded. D3FEND is always bundled.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.matrixSource" value="bundled">
            <option value="bundled">Bundled</option>
            <option value="splunk">Imported</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="ATT&amp;CK version" help="Imported data only. Enter a version such as 19.1, or just 19 for the newest 19.x. Leave blank for the newest imported version.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.attackVersion" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="ID field" help="Name of the search field that holds the technique IDs (for example T1059). Leave blank to use the first field.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.idField" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Value field" help="Name of the search field with the numbers that set the colors. Leave blank to use the second field. Its name is shown as the legend title.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.valueField" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Description field" help="Name of the search field whose text appears in the tooltip. Leave blank to use the third field.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.descriptionField" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Status field" help="Name of a text field (for example covered, partial, gap) that sets the colors instead of numbers. Leave blank to color by number.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.statusField" value="">
        </splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Display">
    <splunk-control-group label="Show" help="What each cell shows: the technique ID, or the ID with the technique name below it.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.display" value="id">
            <option value="id">ID</option>
            <option value="name">ID + name</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Sub-techniques" help="Include sub-techniques in tooltips and in each tactic's counts. Choose No to show techniques only.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showSubTechniques" value="yes">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Hide empty" help="Hide techniques and tactics that have no value in the search results.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.hideNull" value="no">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Sort by" help="What decides the order of techniques within a tactic.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.sortKey" value="data-value">
            <option value="data-value">Value</option>
            <option value="data-name">Name</option>
            <option value="data-id">ID</option>
            <option value="data-status">Status</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Sort order" help="Descending puts the highest value (or Z to A) first. Ascending puts the lowest value (or A to Z) first.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.sortOrder" value="desc">
            <option value="desc">Descending</option>
            <option value="asc">Ascending</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Search bar" help="Show a box above the matrix to find techniques by ID or name. Matches are outlined and everything else fades.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showSearchBar" value="yes">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Wall mode" help="For a screen nobody is interacting with. Cells twinkle and tactic names briefly scramble, purely for show. It pauses when someone uses the panel, when the browser tab is hidden, and when the browser asks for less motion.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.wallMode" value="no">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Colors">
    <splunk-control-group label="Palette" help="The color scheme. Default and Risk use the Low, Middle and High colors below; Risk flips them so low values are good and high values are bad. Sequential blues and Viridis have their own colors.">
        <splunk-select name="{{VIZ_NAMESPACE}}.palette" value="default">
            <option value="default">Default</option>
            <option value="risk">Risk (reversed)</option>
            <option value="blues">Sequential blues</option>
            <option value="viridis">Viridis</option>
        </splunk-select>
    </splunk-control-group>
    <splunk-control-group label="Low color" help="Color for the lowest values. Used by the Default and Risk palettes.">
        <splunk-color-picker type="custom" name="{{VIZ_NAMESPACE}}.startColor" value="#B63457">
            <splunk-color>#F9E721</splunk-color>
            <splunk-color>#FCFCBD</splunk-color>
            <splunk-color>#22908D</splunk-color>
            <splunk-color>#B83679</splunk-color>
            <splunk-color>#B63457</splunk-color>
            <splunk-color>#440C53</splunk-color>
            <splunk-color>#0C1587</splunk-color>
            <splunk-color>#000000</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Middle color" help="Color for values halfway between the lowest and highest. Used by the Default and Risk palettes.">
        <splunk-color-picker type="custom" name="{{VIZ_NAMESPACE}}.midColor" value="#FCFCBD">
            <splunk-color>#F9E721</splunk-color>
            <splunk-color>#FCFCBD</splunk-color>
            <splunk-color>#22908D</splunk-color>
            <splunk-color>#B83679</splunk-color>
            <splunk-color>#B63457</splunk-color>
            <splunk-color>#440C53</splunk-color>
            <splunk-color>#0C1587</splunk-color>
            <splunk-color>#000000</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="High color" help="Color for the highest values. Used by the Default and Risk palettes.">
        <splunk-color-picker type="custom" name="{{VIZ_NAMESPACE}}.endColor" value="#22908D">
            <splunk-color>#F9E721</splunk-color>
            <splunk-color>#FCFCBD</splunk-color>
            <splunk-color>#22908D</splunk-color>
            <splunk-color>#B83679</splunk-color>
            <splunk-color>#B63457</splunk-color>
            <splunk-color>#440C53</splunk-color>
            <splunk-color>#0C1587</splunk-color>
            <splunk-color>#000000</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>
    <splunk-control-group label="Color bands" help="How many color steps the scale has. With Manual bounds each step covers an equal range of values. With bounds From data, each step holds about the same number of techniques.">
        <splunk-select name="{{VIZ_NAMESPACE}}.colorBands" value="5">
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="7">7</option>
            <option value="9">9</option>
        </splunk-select>
    </splunk-control-group>
    <splunk-control-group label="Status colors" help="One color per status, written as status=#color and separated by commas, for example covered=#53a051, gap=#d93f3c. The order sets the legend and sort order. Used only when a Status field is set.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.statusColors" value="">
        </splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Scale">
    <splunk-control-group label="Roll up sub-techniques" help="If your search returns sub-technique IDs, show their combined value on the parent technique when it has no value of its own. Choose how to combine them: sum, highest, average or count.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.rollup" value="none">
            <option value="none">None</option>
            <option value="sum">Sum</option>
            <option value="max">Max</option>
            <option value="avg">Average</option>
            <option value="count">Count</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Color bounds" help="Manual uses the Lower and Upper bound below. From data uses the lowest and highest values in the results, starting at 0 unless a value is negative.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.scaleMode" value="manual">
            <option value="manual">Manual</option>
            <option value="auto">From data</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Lower bound" help="The value that gets the lowest color. Used only when Color bounds is Manual.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.startVal" value="0">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Upper bound" help="The value that gets the highest color. Used only when Color bounds is Manual.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.endVal" value="100">
        </splunk-text-input>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Export">
    <splunk-control-group label="Export button" help="Add a button that saves the current data as an ATT&amp;CK Navigator layer file. Not available for D3FEND.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showExportButton" value="no">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </splunk-radio-input>
    </splunk-control-group>
</form>

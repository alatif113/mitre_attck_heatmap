[MITRE ATT&CK - update matrix collection]
disabled = 1
enableSched = 1
cron_schedule = 0 5 * * 1
dispatch.earliest_time = -400d@d
dispatch.latest_time = now
description = Copies the matrices imported by bin/import_matrices.py into the mitre_matrix KV Store collection that the heatmap reads. Enable it together with the scripted input.
search = `mitre_attck_matrix_index` sourcetype="mitre:attck:matrix" \
| spath input=_raw path=kind output=kind \
| search kind=matrix \
| spath input=_raw path=matrix output=matrix \
| spath input=_raw path=version output=version \
| spath input=_raw path=modified output=modified \
| spath input=_raw path=imported_at output=imported_at \
| spath input=_raw path=sha256 output=sha256 \
| spath input=_raw path=schema output=schema \
| spath input=_raw path=data_json output=data_json \
| eval _key=matrix."-".version \
| dedup _key \
| table _key matrix version modified imported_at sha256 schema data_json \
| outputlookup append=true mitre_matrix

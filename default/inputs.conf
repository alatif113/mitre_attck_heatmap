# Downloads MITRE ATT&CK matrices and prints them as events. Disabled by default;
# enable it (and the scheduled search "MITRE ATT&CK - update matrix collection")
# to let the visualization use the imported data instead of its bundled snapshot.
# Settings: default/mitre_attck_import.conf, overridden in local/.
[script://./bin/import_matrices.py]
disabled = 1
interval = 0 4 * * 1
sourcetype = mitre:attck:matrix
python.version = python3
start_by_shell = false
